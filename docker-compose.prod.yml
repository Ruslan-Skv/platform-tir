# Production override for Platform TIR
# Использование: docker compose -f docker-compose.infra.yml -f docker-compose.prod.yml up -d
#
# Образы backend, frontend, nginx собираются в GitHub Actions и публикуются в GHCR.
# На сервере — только pull (без сборки). Переменная GHCR_IMAGE_PREFIX — владелец образа.
#
# Перед запуском:
#   1. Скопируйте .env.production.example в .env
#   2. Заполните JWT_SECRET, POSTGRES_PASSWORD
#   3. Для SSL: подготовьте сертификаты в ./nginx/ssl/
#
# Ресурсы: оптимизированы для VPS 8 GB RAM, 6 vCPU.
# Подробнее: docs/VPS-OPTIMIZATION.md

services:
  postgres:
    mem_limit: 1g
    cpus: '2'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-platform_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required for production}
      POSTGRES_DB: ${POSTGRES_DB:-platform_tir}
    ports: []  # Не публикуем порт в production (доступ только из Docker-сети)
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-platform_user}']
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    mem_limit: 2g
    cpus: '2'
    ports: []  # Не публикуем
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - 'ES_JAVA_OPTS=-Xms1g -Xmx1g'
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1

  backend:
    image: ${GHCR_IMAGE_PREFIX:-ghcr.io/ruslan-skv}/platform-tir-backend:latest
    mem_limit: 1g
    cpus: '2'
    volumes:
      - backend_uploads:/app/uploads
      # CA с хоста (НУЦ Минцифры) — TLS к platform-api2.max.ru
      - /etc/ssl/certs:/etc/ssl/certs:ro
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required for production}
      ELASTICSEARCH_NODE: http://elasticsearch:9200
      CORS_ORIGIN: ${CORS_ORIGIN:-https://example.com}
      API_BASE_URL: ${API_BASE_URL:-https://example.com/api/v1}
      SITE_URL: ${SITE_URL:-https://example.com}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required for production}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-rt}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-true}
      REFRESH_COOKIE_DOMAIN: ${REFRESH_COOKIE_DOMAIN:-}
      NODE_ENV: production
      # Yandex ID OAuth (вход через Яндекс). Без них — 400 на GET /auth/yandex
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
      # Для скрипта create-super-admin.cjs (опционально)
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-admin@platform.local}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-Admin123!}
      # Письма (восстановление пароля, заказ на email). Без SMTP письма не отправятся
      MAIL_FROM: ${MAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      # Telegram (уведомления о заявках с форм). Без токена — только email
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      # MAX (уведомления в мессенджер MAX). Без токена — только email/Telegram
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      MAX_API_BASE_URL: ${MAX_API_BASE_URL:-https://platform-api2.max.ru}
      # Сброс битого bundle из старых образов; доверяем /etc/ssl/certs (mount с хоста)
      NODE_EXTRA_CA_CERTS: ''
      # Web Push (уведомления админки в установленном PWA на телефоне)
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
    ports: []  # Доступ только через nginx
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3001/api/v1/site-public/config',r=>{let d='';r.on('data',c=>d+=c);r.on('end',()=>process.exit(r.statusCode===200?0:1))}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    image: ${GHCR_IMAGE_PREFIX:-ghcr.io/ruslan-skv}/platform-tir-frontend:latest
    mem_limit: 1g
    cpus: '1.5'
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://backend:3001
    ports: []  # Доступ только через nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3000/',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  nginx:
    image: ${GHCR_IMAGE_PREFIX:-ghcr.io/ruslan-skv}/platform-tir-nginx:latest
    container_name: platform-tir-nginx
    mem_limit: 128m
    cpus: '0.5'
    ports:
      - '80:80'
      # Для SSL раскомментируйте и смонтируйте сертификаты:
      # - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Для SSL:
      # - ./nginx/ssl:/etc/nginx/ssl:ro
      # - ./nginx/nginx.ssl.conf:/etc/nginx/conf.d/ssl.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # Сначала HTTPS (если конфиг только с 443), иначе HTTP
      test: ['CMD-SHELL', 'wget -q -O /dev/null --no-check-certificate https://localhost/health 2>/dev/null || wget -q -O /dev/null http://localhost/health']
      interval: 30s
      timeout: 5s
      retries: 3
