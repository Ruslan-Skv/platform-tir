services:
  postgres:
    image: postgres:16-alpine
    container_name: platform-tir-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: platform_tir
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: platform-tir-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - 'ES_JAVA_OPTS=-Xms512m -Xmx512m'
    ports:
      - '9200:9200'
      - '9300:9300'
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:9200/_cluster/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: platform-tir-mailhog
    ports:
      - '1025:1025'   # SMTP (куда бэкенд отправляет письма)
      - '8025:8025'   # Web UI — просмотр писем в браузере http://localhost:8025
    restart: unless-stopped

  # Одноразовый запуск сида: docker compose run --rm seed
  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: builder
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/platform_tir?schema=public
    command: ["sh", "-c", "npm run prisma:seed"]
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: platform-tir-backend
    ports:
      - '3001:3001'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/platform_tir?schema=public
      ELASTICSEARCH_NODE: http://elasticsearch:9200
      PORT: 3001
      CORS_ORIGIN: http://localhost:3000
      API_BASE_URL: ${API_BASE_URL:-http://localhost:3001}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      # Письма уходят в MailHog (просмотр: http://localhost:8025)
      MAIL_FROM: ${MAIL_FROM:-noreply@localhost}
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      mailhog:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000/api/v1}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        API_INTERNAL_URL: ${API_INTERNAL_URL:-http://backend:3001}
    container_name: platform-tir-frontend
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://backend:3001
    depends_on:
      - backend

volumes:
  postgres_data:
  elasticsearch_data:
  backend_uploads:
