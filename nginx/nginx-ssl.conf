# Production nginx config with SSL
# Использование: смонтируйте вместо nginx.conf при включённом SSL

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    gzip on;
    # Длинные Punycode-домены (территория-интерьерных-решений.рф) требуют увеличения
    server_names_hash_bucket_size 128;
    gzip_types text/plain text/css application/json application/javascript;
    large_client_header_buffers 4 16k;

    # Лимит тела запроса (создание/редактирование товаров с изображениями в base64)
    client_max_body_size 25m;

    upstream frontend {
        server frontend:3000;
    }
    upstream backend {
        server backend:3001;
    }

    # HTTP → HTTPS redirect (порт 80)
    server {
        listen 80;
        server_name _;
        # Healthcheck для Docker: 200 на /health, иначе редирект не ломает проверку
        location = /health {
            default_type text/plain;
            return 200 'ok';
        }
        return 301 https://$host$request_uri;
    }

    # Зеркала и www: 301 редирект на основной домен (для SEO — один канонический URL)
    # Основной: territory-interior.ru
    # Зеркала: территория-интерьерных-решений.рф, 601270.ru, www.territory-interior.ru
    server {
        listen 443 ssl;
        server_name www.territory-interior.ru xn-----mlcbabasabfm9bcdf6aacfbc3aeg7f4dwdza7f.xn--p1ai 601270.ru;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        location / {
            return 301 https://territory-interior.ru$request_uri;
        }
    }

    # HTTPS — основной домен territory-interior.ru
    # Примечание: HTTP/2 (listen 443 ssl http2) может вызывать ERR_HTTP2_PROTOCOL_ERROR
    # при проксировании к Next.js. Используем HTTP/1.1 для стабильности.
    server {
        listen 443 ssl;
        server_name territory-interior.ru;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        # Healthcheck для Docker (на случай если порт 80 не слушается в кастомном конфиге)
        location = /health {
            default_type text/plain;
            return 200 'ok';
        }

        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 86400;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
            proxy_max_temp_file_size 0;
        }

        location /api/v1/ {
            proxy_pass http://backend/api/v1/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
        }

        location /uploads/ {
            proxy_pass http://backend/uploads/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Квиз «Мебель на заказ» — отдельный домен (лендинг без основного сайта)
    server {
        listen 443 ssl;
        server_name mebel-na-zakaz-51.ru;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        location = /health {
            default_type text/plain;
            return 200 'ok';
        }

        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        location /api/v1/ {
            proxy_pass http://backend/api/v1/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /uploads/ {
            proxy_pass http://backend/uploads/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
